backend:
  name: git-gateway
  branch: main

# Panelden yayındaki siteye dönüş bağlantısı için gerekli.
site_url: "https://maltstudio.co"

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "tr"

collections:
  - name: "site"
    label: "Site İçeriği"
    files:
      - file: "content.json"
        label: "Ana Sayfa"
        name: "homepage"
        fields:
          # —— Global Settings ——
          - label: "Site Adı"
            name: "siteName"
            widget: "string"
            required: false
            hint: "—— Global Settings —— Marka ve site genelinde kullanılan ad."

          - { label: "Site URL", name: "siteUrl", widget: "string", required: false }
          - { label: "Varsayılan Dil", name: "defaultLanguage", widget: "string", required: false }
          - { label: "Varsayılan Locale", name: "defaultLocale", widget: "string", required: false }

          # —— Marka ——
          - label: "Logo"
            name: "logo"
            widget: "image"
            required: false
            hint: "—— Marka —— Yüklenirse sitede CMS logosu gösterilir. Boş bırakılırsa mevcut SVG logo kullanılır. En fazla 1 MB."
            # Git tabanlı depoda büyük dosyalar kalıcı olarak kalır; yükleme boyutu sınırlanır.
            media_library:
              config:
                max_file_size: 1048576

          # —— Hero ——
          - label: "Üst Etiket (Eyebrow)"
            name: "eyebrow"
            widget: "string"
            hint: "—— Hero Bölümü ——"

          - { label: "Başlık - Üst Satır", name: "heroTitleTop", widget: "string" }
          - { label: "Başlık - Vurgulu Kelime", name: "heroHighlight", widget: "string" }
          - { label: "Başlık - Alt Satır", name: "heroTitleBottom", widget: "string" }
          - { label: "Ana Açıklama", name: "heroSub", widget: "text" }
          - { label: "Ana Buton Metni", name: "ctaPrimary", widget: "string" }
          - { label: "İkincil Buton Metni", name: "ctaSecondary", widget: "string" }

          # —— Hizmetler ——
          - label: "Hizmetler - Üst Etiket"
            name: "servicesTag"
            widget: "string"
            hint: "—— Hizmetler Bölümü ——"

          - { label: "Hizmetler - Başlık", name: "servicesTitle", widget: "string" }
          - { label: "Hizmetler - Açıklama", name: "servicesIntro", widget: "text" }
          - label: "Hizmetler Listesi"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Açıklama", name: "description", widget: "text" }

          # —— Portfolyo ——
          - label: "Portfolyo - Üst Etiket"
            name: "portfolioTag"
            widget: "string"
            hint: "—— Portfolyo Bölümü ——"

          - { label: "Portfolyo - Başlık", name: "portfolioTitle", widget: "string" }
          - { label: "Portfolyo - Açıklama", name: "portfolioIntro", widget: "text" }
          - label: "Portfolyo Projeleri"
            name: "portfolio"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - { label: "Proje / Marka Adı", name: "name", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string", required: false, hint: "URL-dostu proje kimliği. Örn: ofiso" }
              - { label: "Kategori", name: "category", widget: "string" }
              - { label: "Açıklama", name: "description", widget: "text", required: false }
              - label: "Kapak Görseli"
                name: "image"
                widget: "image"
                required: false
                hint: "En fazla 3 MB. Önerilen: 1200×1500 JPG. Deploy sırasında kart boyutu (~1200px) + WebP üretilir."
                media_library:
                  config:
                    max_file_size: 3145728
              - label: "Galeri"
                name: "gallery"
                widget: "list"
                required: false
                field:
                  label: "Görsel"
                  name: "image"
                  widget: "image"
                  media_library:
                    config:
                      max_file_size: 3145728
              - { label: "Müşteri", name: "client", widget: "string", required: false }
              - { label: "Lokasyon", name: "location", widget: "string", required: false }
              - { label: "Yıl", name: "year", widget: "string", required: false }
              - { label: "Tamamlanma Tarihi", name: "completedDate", widget: "string", required: false, hint: "Örn: 2024-06 veya Haziran 2024" }
              - label: "Proje Hizmetleri"
                name: "services"
                widget: "list"
                required: false
                field: { label: "Hizmet", name: "service", widget: "string" }
              - { label: "Öne Çıkan", name: "featured", widget: "boolean", default: false, required: false }

          # —— İstatistikler ——
          - label: "İstatistikler"
            name: "stats"
            widget: "list"
            hint: "—— İstatistikler Bölümü —— Sürükleyerek sıralayabilirsiniz."
            summary: "{{fields.number}} {{fields.label}}"
            fields:
              - { label: "Sayı", name: "number", widget: "string" }
              - { label: "Etiket", name: "label", widget: "string" }

          # —— CTA ——
          - label: "Alt CTA - Üst Etiket"
            name: "ctaSectionTag"
            widget: "string"
            hint: "—— CTA Bölümü ——"

          - { label: "Alt CTA - Başlık", name: "ctaSectionTitle", widget: "string" }

          # —— Footer ——
          - label: "Footer - Hakkımızda Metni"
            name: "footerAbout"
            widget: "text"
            hint: "—— Footer Bölümü ——"

          - { label: "Telif Metni", name: "copyrightText", widget: "string" }

          # —— İletişim ——
          - label: "E-posta"
            name: "email"
            widget: "string"
            hint: "—— İletişim ——"

          - { label: "Telefon", name: "phone", widget: "string", hint: "Görünen numara. Şemada E.164 için WhatsApp numarası da kullanılır." }
          - { label: "Adres (serbest metin)", name: "address", widget: "string", hint: "Sitede görünen kısa adres satırı." }
          - { label: "Sokak / Cadde", name: "addressStreet", widget: "string", required: false, hint: "—— Yerel SEO (Schema) —— Bilinmiyorsa boş bırakın; uydurmayın." }
          - { label: "İlçe / Şehir", name: "addressLocality", widget: "string", required: false }
          - { label: "İl / Bölge", name: "addressRegion", widget: "string", required: false }
          - { label: "Posta Kodu", name: "addressPostalCode", widget: "string", required: false }
          - { label: "Ülke Kodu (ISO)", name: "addressCountry", widget: "string", required: false, hint: "Örn: TR" }
          - { label: "Enlem (geo)", name: "geoLatitude", widget: "string", required: false, hint: "Boş bırakılırsa GeoCoordinates üretilmez." }
          - { label: "Boylam (geo)", name: "geoLongitude", widget: "string", required: false }
          - { label: "Google Maps URL", name: "googleMapsUrl", widget: "string", required: false }
          - { label: "Fiyat Aralığı", name: "priceRange", widget: "string", required: false, hint: "Örn: ₺₺ — bilinmiyorsa boş." }
          - { label: "Resmi Ünvan (legalName)", name: "legalName", widget: "string", required: false }
          - { label: "Kuruluş Tarihi (YYYY-MM-DD)", name: "foundingDate", widget: "string", required: false }
          - label: "Çalışma Saatleri"
            name: "openingHours"
            widget: "list"
            required: false
            hint: "Boşsa OpeningHoursSpecification üretilmez."
            fields:
              - { label: "Günler (örn: Monday,Tuesday)", name: "days", widget: "string" }
              - { label: "Açılış (HH:MM)", name: "opens", widget: "string" }
              - { label: "Kapanış (HH:MM)", name: "closes", widget: "string" }
          - label: "Schema Hizmetleri"
            name: "schemaServices"
            widget: "list"
            required: false
            hint: "ProfessionalService / knowsAbout için hizmet adları."
            field: { label: "Hizmet", name: "service", widget: "string" }
          - { label: "WhatsApp Numarası (ülke koduyla, örn: 905xxxxxxxxx)", name: "whatsappNumber", widget: "string" }
          - { label: "WhatsApp Karşılama Mesajı", name: "whatsappMessage", widget: "string" }

          # —— Sosyal Medya ——
          - label: "Instagram Linki"
            name: "instagram"
            widget: "string"
            required: false
            hint: "—— Sosyal Medya —— Boş bırakılabilir."

          - { label: "LinkedIn Linki", name: "linkedin", widget: "string", required: false }
          - { label: "Behance Linki", name: "behance", widget: "string", required: false }
          - { label: "Youtube Linki", name: "youtube", widget: "string", required: false }

          # —— SEO ——
          - label: "Sayfa Başlığı (SEO Title)"
            name: "seoTitle"
            widget: "string"
            required: false
            hint: "—— SEO Ayarları ——"

          - { label: "Meta Açıklama", name: "seoDescription", widget: "text", required: false }
          - { label: "Anahtar Kelimeler", name: "seoKeywords", widget: "string", required: false }
          - label: "Open Graph Görseli"
            name: "seoOgImage"
            widget: "image"
            required: false
            hint: "Paylaşım görseli. Önerilen 1200x630 px, en fazla 3 MB."
            media_library:
              config:
                max_file_size: 3145728
          - label: "Favicon"
            name: "seoFavicon"
            widget: "image"
            required: false
            hint: "Boş bırakılırsa /images/icon-192.png kullanılır. En fazla 1 MB."
            media_library:
              config:
                max_file_size: 1048576
          - { label: "Canonical URL", name: "canonicalUrl", widget: "string", required: false }

          # —— Analytics (Measurement ID → tüm public sayfa <head> içine gtag) ——
          - label: "Google Analytics ID"
            name: "googleAnalyticsId"
            widget: "string"
            required: false
            hint: "—— Analytics —— GA4 Measurement ID (örn. G-XXXXXXXXXX). Deploy/prerender sonrası tüm public sayfa <head> içinde bir kez yüklenir."

          - { label: "Google Tag Manager ID", name: "googleTagManagerId", widget: "string", required: false }
          - { label: "Google Search Console Doğrulama Kodu", name: "googleSearchConsoleVerification", widget: "string", required: false }
          - { label: "Facebook Pixel ID", name: "facebookPixelId", widget: "string", required: false }

  # Müşteri proje takip sayfaları (/proje/{slug}/). Portfolyo /projeler/ ile karışmaz.
  # Veri content.json içinde DEĞİL — content/proje/*.json (public /content.json sızıntısı yok).
  - name: "project_tracking"
    label: "Proje Takip"
    label_singular: "Proje Takip"
    folder: "content/proje"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: "slug"
    summary: "{{clientName}} — {{projectName}}"
    fields:
      - { label: "Müşteri Adı", name: "clientName", widget: "string", hint: "Sayfada görünen müşteri adı. Örn: Mantra Garage" }
      - { label: "Proje Adı", name: "projectName", widget: "string", required: false, hint: "Boş bırakılırsa yalnızca müşteri adı gösterilir. Örn: Mantra Garage Tabela" }
      - { label: "Proje Açıklaması", name: "description", widget: "text", required: false, hint: "Örn: Tabela Tasarımı ve Üretimi" }
      - label: "Slug (URL)"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Sadece küçük harf, rakam ve tire. Örn: mantra-garage-7f3k9x']
        hint: "Bu değer müşteriye gönderilecek proje linkinin bir parçasıdır. Yayınlandıktan sonra değiştirmeyin."
      - { label: "Proje Aktif mi?", name: "public", widget: "boolean", default: true, hint: "Kapalıysa müşteri sayfası oluşturulmaz." }
      - label: "Aşamalar"
        name: "steps"
        widget: "list"
        summary: "{{title}} — {{status}}"
        min: 1
        hint: "Sürükleyerek sıralayın. Yalnızca bir aşama 'Şu an' olmalı."
        fields:
          - { label: "Başlık", name: "title", widget: "string" }
          - { label: "Açıklama", name: "description", widget: "text", required: false }
          - label: "Durum"
            name: "status"
            widget: "select"
            options:
              - { label: "Tamamlandı", value: "completed" }
              - { label: "Şu an", value: "current" }
              - { label: "Bekliyor", value: "pending" }
            default: "pending"
          - { label: "Tamamlanma Tarihi", name: "completedDate", widget: "string", required: false, hint: "Örn: 2026-08-10" }
      - { label: "Mevcut Aşama (1 = ilk)", name: "currentStep", widget: "number", value_type: "int", min: 1, required: false, hint: "Bir aşamada status=Şu an varsa bu sayı o aşamanın sırasıyla aynı olmalı. Çelişirse build hata verir." }
      - { label: "Son Güncelleme", name: "lastUpdated", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Durum değişince bu tarihi elle güncelleyin. Decap/statik sitede güvenilir otomatik timestamp yok." }
      - { label: "Kalan bakiye", name: "balance", widget: "string", required: false, hint: "Örn: 22.500₺/45.000₺ — sağda görünür; boşsa gösterilmez." }
      - label: "Kapak Görseli (opsiyonel)"
        name: "coverImage"
        widget: "image"
        required: false
        media_library:
          config:
            max_file_size: 3145728
