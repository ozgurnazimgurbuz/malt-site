<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <script>
    /* Decap bir hash yönlendiricisi; açılışta adres parçasını "#/" ile ezdiği için
       buraya elle taşınan davet token'ı kaybolur. Token'ı, akışı tamamlayabilen
       kök sayfaya Decap yüklenmeden önce devrediyoruz. */
    (function () {
      var hash = window.location.hash;
      if (/[#&](invite_token|recovery_token|confirmation_token|email_change_token)=/.test(hash)) {
        window.location.replace('/' + hash);
      }
    })();
  </script>
  <title>Malt Studio — Yönetim Paneli</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <!-- Netlify Identity: giriş/kayıt kutusunu sağlar -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Decap CMS (eski adıyla Netlify CMS) -->
  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
