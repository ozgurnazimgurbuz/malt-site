# CMS content.json her deploy'da index.html'e gömülür (JS'siz ilk HTML).
[build]
  command = "python3 scripts/build_production.py && python3 scripts/scrub_customer_copy.py && python3 scripts/prerender.py && python3 scripts/build_llms.py"
  # build_production runs Wave A3 home builder; scrub removes internal SEO jargon; prerender bakes content.json into index.html; build_llms writes llms.txt + .md twins for AI agents
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Bazı istemciler <link rel="icon"> etiketine bakmadan doğrudan /favicon.ico ister.
[[redirects]]
  from = "/favicon.ico"
  to = "/images/icon-192.png"
  status = 301

# Decap medya dosyaları içerik değişince aynı adı koruyabildiği için süresiz önbelleğe alınmaz.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CMS güncellemelerinin anında görünmesi için her istekte doğrulanır.
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex"

# AI-agent discovery + Markdown twins (not in sitemap; agents fetch on demand).
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/**/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
