# CMS content.json her deploy'da index.html'e gömülür (JS'siz ilk HTML).
[build]
  command = "python3 scripts/build_production.py && python3 scripts/prerender.py"
  # build_production runs Wave A3 home builder; prerender bakes content.json into index.html
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Bazı istemciler <link rel="icon"> etiketine bakmadan doğrudan /favicon.ico ister.
[[redirects]]
  from = "/favicon.ico"
  to = "/images/icon-192.png"
  status = 301

# Decap medya dosyaları içerik değişince aynı adı koruyabildiği için süresiz önbelleğe alınmaz.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CMS güncellemelerinin anında görünmesi için her istekte doğrulanır.
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex"
